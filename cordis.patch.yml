# dsh-GotoFile bundle patch: inserts the plugin row into the web plugin roster.
# The single row mounts BOTH halves: the host side (per-turn mutation registry +
# /api/goto-file/{check,open,config} routes) and the browser side (the turn-tail
# text report served from this package's lib/client.js).
- insert:
    - id: goto-file
      name: dsh-GotoFile
